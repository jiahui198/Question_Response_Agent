<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>智能问答 Agent</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ==================== 登录 / 注册 ==================== -->
<div id="authView" class="auth-view" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">🤖</div>
    <h1 class="auth-title">智能问答 Agent</h1>
    <p class="auth-sub">LangGraph · 工具调用 · 长短时记忆 · SSE 流式输出</p>

    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
      <button id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>

    <div id="loginForm">
      <input id="loginEmail" type="email" placeholder="邮箱" autocomplete="username">
      <input id="loginPwd" type="password" placeholder="密码" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn-primary" onclick="doLogin()">登 录</button>
    </div>

    <div id="registerForm" style="display:none">
      <input id="regName" placeholder="用户名">
      <input id="regEmail" type="email" placeholder="邮箱" autocomplete="username">
      <input id="regPwd" type="password" placeholder="密码（至少6位）" autocomplete="new-password"
             onkeydown="if(event.key==='Enter')doRegister()">
      <button class="btn-primary" onclick="doRegister()">注 册</button>
    </div>

    <div id="authErr" class="auth-err"></div>
  </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div id="appView" class="app-view" style="display:none">

  <!-- 移动端遮罩 -->
  <div id="mask" class="mask" onclick="closeSidebar()"></div>

  <!-- 侧边栏 -->
  <aside id="sidebar" class="sidebar">
    <button class="new-chat" onclick="newChat()">
      <span class="plus">＋</span> 开启新对话
    </button>
    <div id="convList" class="conv-list"></div>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">U</div>
        <div class="user-name" id="userName">用户</div>
      </div>
      <button class="icon-btn" title="退出登录" onclick="doLogout()">
        <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-8v2h8v14h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
      </button>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn hamburger" onclick="openSidebar()">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <div class="topbar-title" id="convTitle">新对话</div>
      <button class="icon-btn" title="切换主题" onclick="toggleTheme()">
        <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-5.4-5.4c0-1.81.89-3.42 2.26-4.4A9 9 0 0 0 12 3z"/></svg>
      </button>
    </header>

    <div id="msgs" class="msgs">
      <!-- 欢迎页 -->
      <div id="welcome" class="welcome">
        <div class="welcome-logo">🤖</div>
        <h2>有什么可以帮你的？</h2>
        <p>支持工具调用、多轮记忆、流式输出</p>
        <div class="suggest-grid">
          <div class="suggest-card" onclick="useSuggest('现在几点了？')">🕐 现在几点了？</div>
          <div class="suggest-card" onclick="useSuggest('帮我算一下 (128+256)*3')">🧮 帮我算一下 (128+256)*3</div>
          <div class="suggest-card" onclick="useSuggest('介绍一下 LangGraph 是什么')">📚 介绍一下 LangGraph</div>
          <div class="suggest-card" onclick="useSuggest('给我讲个程序员笑话')">😄 讲个程序员笑话</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="sendBtn" class="send-btn" onclick="send()" aria-label="发送">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="input-tip">内容由 AI 生成，仅供参考</div>
    </div>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
