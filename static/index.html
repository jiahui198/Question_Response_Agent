<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能问答 Agent</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui,sans-serif; background:#f0f2f5; height:100vh; display:flex; flex-direction:column; }
  #login { width:320px; margin:15vh auto; background:#fff; padding:32px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  #login h2 { margin-bottom:20px; font-size:18px; }
  #login input { width:100%; padding:10px; margin-bottom:12px; border:1px solid #d9d9d9; border-radius:6px; }
  #login button { width:100%; padding:10px; background:#1677ff; color:#fff; border:none; border-radius:6px; cursor:pointer; }
  #chat { display:none; max-width:760px; width:100%; margin:0 auto; flex:1; flex-direction:column; padding:16px; }
  #msgs { flex:1; overflow-y:auto; padding:12px; }
  .msg { max-width:75%; padding:10px 14px; margin:8px 0; border-radius:12px; white-space:pre-wrap; word-break:break-word; line-height:1.6; }
  .user { margin-left:auto; background:#1677ff; color:#fff; border-bottom-right-radius:2px; }
  .assistant { background:#fff; border-bottom-left-radius:2px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  #bar { display:flex; gap:8px; padding:12px 0; }
  #bar input { flex:1; padding:12px; border:1px solid #d9d9d9; border-radius:8px; }
  #bar button { padding:0 24px; background:#1677ff; color:#fff; border:none; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>

<div id="login">
  <h2>智能问答 Agent 登录</h2>
  <input id="email" placeholder="邮箱" value="docker@test.com">
  <input id="password" type="password" placeholder="密码" value="test123456">
  <button onclick="login()">登 录</button>
</div>

<div id="chat">
  <div id="msgs"></div>
  <div id="bar">
    <input id="input" placeholder="输入消息，回车发送..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>

<script>
let token = '';
let conversationId = null;   // 从 meta 事件拿到，后续消息带上实现多轮

async function login() {
  const form = new URLSearchParams();
  form.append('username', document.getElementById('email').value);
  form.append('password', document.getElementById('password').value);
  const r = await fetch('/auth/login', { method: 'POST', body: form });
  if (!r.ok) { alert('登录失败'); return; }
  token = (await r.json()).access_token;
  document.getElementById('login').style.display = 'none';
  document.getElementById('chat').style.display = 'flex';
}

function appendMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  const box = document.getElementById('msgs');
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  appendMsg('user', text);
  const aiDiv = appendMsg('assistant', '');

  const body = { message: text };
  if (conversationId) body.conversation_id = conversationId;

  const resp = await fetch('/chat/stream', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  // fetch + ReadableStream 手动解析 SSE（EventSource 不支持 POST/Header）
  const reader = resp.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {   // SSE 事件以两个换行分隔
      const raw = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      if (!raw.startsWith('data:')) continue;
      const evt = JSON.parse(raw.slice(5).trim());
      if (evt.type === 'meta') {
        conversationId = evt.conversation_id;
      } else if (evt.type === 'delta') {
        aiDiv.textContent += evt.content;         // 打字机效果核心
        const box = document.getElementById('msgs');
        box.scrollTop = box.scrollHeight;
      } else if (evt.type === 'error') {
        aiDiv.textContent = '[出错了] ' + evt.message;
      }
    }
  }
}
</script>
</body>
</html>
