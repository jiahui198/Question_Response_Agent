[project]
name = "question-response-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jiahui198", email = "1356479419@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.2.0",
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-dashscope>=0.1.0",
    "langgraph>=0.2.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
question-response-agent = "question_response_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
